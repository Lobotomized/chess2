<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Chess 2</title>
    <link rel="stylesheet" href="/src/main.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;700&display=swap');</style>
    <style>
        body {
            background-color: var(--black-square-color, #4b4747);
            color: var(--piece-white);
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Lilita One', cursive;
            font-size: 48px;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0px 4px 0px var(--piece-black);
            -webkit-text-stroke: 2px var(--piece-black);
        }

        .marketplace-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1200px;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid var(--highlight, #b58863);
            border-radius: 12px;
            padding: 30px;
            width: 300px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: scale(1.05);
            border-color: var(--white-square-color, #f0d9b5);
        }

        .product-card h2 {
            font-family: 'Lilita One', cursive;
            font-size: 32px;
            margin-top: 0;
            color: var(--white-square-color, #f0d9b5);
        }

        .product-card img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 0px rgba(0,0,0,0.5));
        }

        .product-card p {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .buy-button {
            background: #829769;
            color: white;
            border: 3px solid #2e2e2e;
            padding: 15px 30px;
            font-size: 24px;
            font-family: 'Lilita One', cursive;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        .buy-button:hover {
            background: #9ab07e;
        }

        .buy-button.owned {
            background: #555;
            cursor: default;
        }

        .buy-button.owned:hover {
            background: #555;
        }

        .info-button {
            background: #2e2e2e;
            color: white;
            border: 3px solid #f0d9b5;
            padding: 10px 30px;
            font-size: 20px;
            font-family: 'Lilita One', cursive;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .info-button:hover {
            background: #444;
        }

        /* Modal styles for pieces */
        .pieces-content h1 .icon { height: 64px; margin-right: 10px; vertical-align: middle; }
        .pieces-content h1 {
            font-family: 'Lilita One', cursive; font-weight: normal; letter-spacing: 1px;
            color: #000;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 28px;
            border-bottom: 3px solid #a67c52;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pieces-content .piece {
            width: 100%;
            max-width: 600px;
            color: #ffffff; /* Override for better readability */
            text-align: center;
            font-size: 20px;
            margin: 0 auto 30px auto;
            padding: 20px;
            background: linear-gradient(to bottom, #8C6540, #5A3E2B); 
            border-bottom: 6px solid #2d1b15;
            border: 2px solid #000;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .pieces-content .piece img {
            width: 100%;
            max-width: 100px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));
        }
        .pieces-content p {
            max-width: 600px;
            text-align: center;
            margin: 0 auto 20px auto;
            line-height: 1.6;
            font-size: 18px;
            color: #000;
        }
        .pieces-content .piece p {
            color: #fff;
        }

        .back-button {
            margin-top: 50px;
            background: #2e2e2e;
            color: white;
            border: 3px solid #f0d9b5;
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Lilita One', cursive;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <h1><img src="/static/lg/whiteKnight.png" style="height: 48px; vertical-align: middle;"> Marketplace <img src="/static/lg/blackKnight.png" style="height: 48px; vertical-align: middle;"></h1>
    
    <div class="marketplace-container" id="marketplaceItems">
        <!-- Products will be injected here -->
        <h2 style="font-family: 'Lilita One'; text-align: center; width: 100%;">Loading...</h2>
    </div>

    <a href="/" class="back-button">Back to Main Menu</a>

    <script src="/src/auth.js?v=1785418005332"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authModule = window.Auth || null;
            let profile = null;
            if (authModule && authModule.getToken()) {
                profile = await authModule.getMe();
            }

            if (!profile) {
                if (authModule) authModule.showAuthModal();
                document.getElementById('marketplaceItems').innerHTML = '<h2 style="font-family: \'Lilita One\'; text-align: center; width: 100%;">Please log in to view the marketplace.</h2>';
                return;
            }

            const products = [
                {
                    id: 'cyborgs',
                    name: 'Cyborgs Race',
                    image: '/static/lg/whiteCrystal.png',
                    description: 'Unlock the advanced Cyborgs race for multiplayer and hotseat modes! Features mechanical synergies.',
                    price: '10 Euro'
                },
                {
                    id: 'promoters',
                    name: 'Promoters Race',
                    image: '/static/lg/whiteNorthernKing.png',
                    description: 'Unlock the mighty Promoters race! Command legendary units and overwhelm your opponents.',
                    price: '10 Euro'
                }
            ];

            const container = document.getElementById('marketplaceItems');
            container.innerHTML = '';

            products.forEach(product => {
                const isOwned = profile && profile.purchasedRaces && profile.purchasedRaces.includes(product.id);
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h2>${product.name}</h2>
                    <img src="${product.image}" alt="${product.name}">
                    <p>${product.description}</p>
                    <button class="buy-button ${isOwned ? 'owned' : ''}" onclick="handleBuy('${product.id}')">
                        ${isOwned ? 'Owned ✓' : 'Buy for ' + product.price}
                    </button>
                    <button class="info-button" onclick="showRaceInfo('${product.id}')">
                        Info
                    </button>
                `;
                container.appendChild(card);
            });
        });

        async function showRaceInfo(raceId) {
            try {
                const response = await fetch('/pieces');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                
                const header = doc.getElementById(raceId);
                if (!header) {
                    if(window.showAlert) window.showAlert("Information not found.");
                    else alert("Information not found.");
                    return;
                }
                
                // Get all elements until next h1
                let contentHtml = header.outerHTML;
                let nextElem = header.nextElementSibling;
                while (nextElem && nextElem.tagName !== 'H1') {
                    contentHtml += nextElem.outerHTML;
                    nextElem = nextElem.nextElementSibling;
                }

                showInfoModal(contentHtml);
            } catch (err) {
                console.error(err);
                if(window.showAlert) window.showAlert("Failed to load piece info.");
                else alert("Failed to load piece info.");
            }
        }

        function showInfoModal(contentHtml) {
            if (document.getElementById('raceInfoModal')) {
                document.getElementById('raceInfoModal').remove();
            }

            let modalHtml = `
            <div id="raceInfoModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100000; padding: 20px; box-sizing: border-box;">
                <div style="background: rgba(240, 230, 200, 0.95); padding: 30px; border-radius: 12px; border: 4px solid #000; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.5); position: relative; color: black; display: flex; flex-direction: column; align-items: center;">
                    <button onclick="document.getElementById('raceInfoModal').remove()" style="position: absolute; top: 10px; right: 15px; background: transparent; border: none; font-size: 32px; font-weight: bold; cursor: pointer; color: #000;">&times;</button>
                    <div class="pieces-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                        ${contentHtml}
                    </div>
                </div>
            </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function handleBuy(raceId) {
            const authModule = window.Auth || null;
            if (!authModule) return;

            const profile = await authModule.getMe();
            if (!profile) {
                authModule.showAuthModal();
                return;
            }

            if (profile.purchasedRaces && profile.purchasedRaces.includes(raceId)) {
                return; // Already owned
            }

            authModule.promptPurchase(raceId);
        }
    </script>
</body>
</html>
