<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Two - Analytics Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif; 
            font-weight: 700;
            background-color: #2b2b2b;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            font-size: 18px;
        }
        h1 {
            font-family: 'Lilita One', cursive; 
            font-weight: normal; 
            letter-spacing: 1px;
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #363636;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }
        .nav-links a {
            color: #829769;
            text-decoration: none;
            margin: 0 10px;
            font-size: 20px;
        }
        .nav-links a:hover {
            color: #a3bd84;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .stat-card h3 {
            margin-top: 0;
            color: #829769;
            font-family: 'Lilita One', cursive;
            font-weight: normal;
        }
        .stat-value {
            font-size: 3em;
            color: #ffffff;
            font-family: 'Lilita One', cursive;
        }
        .chart-container {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
            height: 300px;
            display: flex;
            justify-content: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid #4d4d4d;
        }
        th {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            margin: 40px 0;
            color: #aaaaaa;
        }
    </style>
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-container">
        <h1>Analytics Dashboard</h1>
        
        <div class="nav-links">
            <a href="/taenadmin">Go to Game Records</a>
        </div>
        
        <div id="loading" class="loading">Loading analytics data...</div>
        
        <div id="analyticsContent" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Games Recorded</h3>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
                
                <div class="stat-card" style="height: auto;">
                    <h3>Top Active Users</h3>
                    <table id="topUsersTable">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Games Played</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="stats-grid">
                <div class="chart-container">
                    <canvas id="modeChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="raceChart"></canvas>
                </div>
            </div>

            <div class="chart-container" style="height: 400px;">
                <canvas id="recentGamesChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function fetchAnalytics() {
            try {
                let headers = {};
                if (typeof Auth !== 'undefined' && Auth.getAuthHeaders) {
                    headers = Auth.getAuthHeaders();
                } else if (localStorage.getItem('chess2_token')) {
                    headers['Authorization'] = `Bearer ${localStorage.getItem('chess2_token')}`;
                }
                const response = await fetch('/api/admin/analytics', { headers });
                if (!response.ok) throw new Error('Failed to fetch analytics');
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyticsContent').style.display = 'block';
                
                renderData(data);
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = 'Error loading analytics data. Make sure you are authorized.';
            }
        }

        function renderData(data) {
            // Total games
            document.getElementById('totalGames').innerText = data.totalGames || 0;
            
            // Top users
            const tbody = document.querySelector('#topUsersTable tbody');
            tbody.innerHTML = '';
            (data.userActivity || []).forEach(user => {
                const tr = document.createElement('tr');
                const username = user._id || 'Anonymous';
                tr.innerHTML = `<td>${username}</td><td>${user.count}</td>`;
                tbody.appendChild(tr);
            });

            // Set up common chart options
            Chart.defaults.color = '#e0e0e0';
            Chart.defaults.font.family = "'Quicksand', sans-serif";

            // Mode Chart
            const modeCtx = document.getElementById('modeChart').getContext('2d');
            new Chart(modeCtx, {
                type: 'pie',
                data: {
                    labels: data.modeDistribution.map(d => d._id || 'Unknown'),
                    datasets: [{
                        data: data.modeDistribution.map(d => d.count),
                        backgroundColor: ['#8bc34a', '#e57373', '#ffb74d', '#4fc3f7', '#ba68c8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Games by Mode', color: '#ffffff', font: { size: 18 } }
                    }
                }
            });

            // Race Chart
            const raceCtx = document.getElementById('raceChart').getContext('2d');
            new Chart(raceCtx, {
                type: 'bar',
                data: {
                    labels: data.raceDistribution.map(d => d._id),
                    datasets: [{
                        label: 'Times Picked',
                        data: data.raceDistribution.map(d => d.count),
                        backgroundColor: '#829769'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Popularity of Races', color: '#ffffff', font: { size: 18 } },
                        legend: { display: false }
                    }
                }
            });

            // Recent Games Chart
            const recentCtx = document.getElementById('recentGamesChart').getContext('2d');
            new Chart(recentCtx, {
                type: 'line',
                data: {
                    labels: data.recentGames.map(d => d._id),
                    datasets: [{
                        label: 'Games Played',
                        data: data.recentGames.map(d => d.count),
                        borderColor: '#4fc3f7',
                        backgroundColor: 'rgba(79, 195, 247, 0.2)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Games Played (Last 14 Days)', color: '#ffffff', font: { size: 18 } }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        window.onload = fetchAnalytics;
    </script>
</body>
</html>
